name: Release Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --prefix app

      - name: Run Tests
        run: npm test --prefix app

  deploy-production:
    runs-on: ubuntu-latest
    needs: validate-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment configuration
        run: |
          test -f release/deployment-config.yml
          test -f release/approvals.yml
          test -f release/rollback.yml
          echo "Configuration files exist."

      - name: Deployment
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
