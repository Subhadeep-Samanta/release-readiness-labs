apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
    spec:
      containers:
      - name: lab-app
        version:
        image: lab-app:v2.3.0
        ports:
        - containerPort: 3000
        env:
        - name: API_KEY
          value From: 
            secretKey Ref :
              name: lab-app-secrets
              key: api-key
        - name: DATABASE_PASSWORD
          value From: 
            secretKey Ref :
              name: lab-app-secrets
              key: DATABASE_PASSWORD
